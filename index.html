<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mi Control de Gastos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5a4fcf">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Bolsillo">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f7ff;
            --card: #ffffff;
            --text: #1a202c;
            --text-secondary: #4a5568;
            --primary: #5a4fcf;
            --primary-gradient: linear-gradient(135deg, #6c5ce7, #a29bfe);
            --danger: #ff7675;
            --success: #00b894;
            --warning: #fdcb6e;
            --border: #e0e4f0;
            --shadow-sm: 0 2px 6px rgba(0,0,0,0.04);
            --shadow: 0 8px 24px rgba(0,0,0,0.08);
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card: #1e293b;
                --text: #f1f5f9;
                --text-secondary: #94a3b8;
                --primary: #a78bfa;
                --primary-gradient: linear-gradient(135deg, #a78bfa, #c4b5fd);
                --border: #334155;
                --shadow-sm: 0 2px 6px rgba(0,0,0,0.3);
                --shadow: 0 8px 24px rgba(0,0,0,0.4);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 16px 12px 80px;
            transition: background var(--transition), color var(--transition);
            -webkit-tap-highlight-color: transparent;
        }
        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 20px 24px;
            border-radius: 24px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(90,79,207,0.3);
            font-weight: 600;
        }
        .header .logo { font-size: 1.5rem; letter-spacing: -0.5px; }
        .ingreso-badge {
            background: rgba(255,255,255,0.25);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            backdrop-filter: blur(5px);
        }
        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: var(--card);
            padding: 6px;
            border-radius: 18px;
            box-shadow: var(--shadow-sm);
        }
        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: transparent;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(90,79,207,0.3);
        }
        .section { display: none; animation: fadeSlide 0.3s ease; }
        .section.active { display: block; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ring-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            text-align: center;
            margin-bottom: 20px;
        }
        .ring-container { display: flex; justify-content: center; margin: 0 0 15px; }
        .summary-row {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 15px;
        }
        .summary-item {
            font-size: 0.9rem;
            font-weight: 500;
        }
        .summary-item span {
            display: block;
            font-weight: 700;
            font-size: 1.3rem;
            margin-top: 4px;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:active { transform: scale(0.98); box-shadow: var(--shadow); }
        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }
        .progress-bar {
            height: 10px;
            background: var(--border);
            border-radius: 10px;
            margin: 12px 0 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .fill-safe { background: var(--success); }
        .fill-warn { background: var(--warning); }
        .fill-danger { background: var(--danger); }
        .row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 0.95rem;
        }
        .row .label { color: var(--text-secondary); }
        .row .value { font-weight: 600; }
        .btn {
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all var(--transition);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 6px 16px rgba(90,79,207,0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(90,79,207,0.4); }
        .btn-danger {
            background: var(--danger);
            box-shadow: 0 4px 10px rgba(255,118,117,0.3);
        }
        .btn-secondary {
            background: var(--text-secondary);
            box-shadow: none;
        }
        .btn-sm {
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 10px;
            width: auto;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 1rem;
            background: var(--card);
            color: var(--text);
            outline: none;
            font-family: inherit;
            transition: border var(--transition), box-shadow var(--transition);
        }
        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(90,79,207,0.2);
        }
        .gasto-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            gap: 10px;
        }
        .gasto-item:last-child { border-bottom: none; }
        .gasto-item .detalle { flex: 1; }
        .gasto-item .categoria-texto { font-weight: 600; font-size: 0.95rem; }
        .gasto-item .fecha { font-size: 0.75rem; color: var(--text-secondary); }
        .gasto-item .monto { font-weight: 700; color: var(--danger); margin-right: 6px; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #1e293b;
            color: white;
            padding: 14px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 999;
            transition: transform 0.3s ease;
            pointer-events: auto;
            white-space: pre-line;
            text-align: center;
            max-width: 90%;
            cursor: pointer;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .floating-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            font-size: 28px;
            box-shadow: 0 8px 25px rgba(90,79,207,0.5);
            cursor: pointer;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        .floating-btn:active { transform: scale(0.9); }
        .floating-btn-share {
            bottom: 90px;
            background: var(--success);
            box-shadow: 0 8px 25px rgba(0,184,148,0.5);
        }
        .text-xs { font-size: 0.75rem; color: var(--text-secondary); }
        .icono-categoria {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: #eee;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
        }
        .offline-badge {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: var(--danger);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .offline-badge.show { opacity: 0.9; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">💰 Mi Bolsillo</div>
    <div class="ingreso-badge">$<span id="ingresoDisplay">0</span>/mes</div>
</div>

<div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('presupuesto')">📊 Resumen</button>
    <button class="tab-btn" onclick="switchTab('config')">⚙️ Metas</button>
    <button class="tab-btn" onclick="switchTab('historial')">📋 Gastos</button>
</div>

<!-- Resumen -->
<div id="presupuesto" class="section active">
    <div class="ring-card">
        <div class="ring-container" id="ringContainer"></div>
        <div style="font-weight:600; font-size:1.4rem;">Disponible $<span id="totalRestante">0</span></div>
        <div class="summary-row">
            <div class="summary-item">Presupuesto <span>$<span id="totalPresupuesto">0</span></span></div>
            <div class="summary-item">Gastado <span style="color:var(--danger)">$<span id="totalGastado">0</span></span></div>
            <div class="summary-item">Ahorro <span style="color:var(--success)">$<span id="ahorroRecomendado">0</span></span></div>
        </div>
    </div>
    <div id="categoriasContainer"></div>
    <button class="floating-btn" onclick="switchTab('historial')">+</button>
    <button class="floating-btn floating-btn-share" onclick="compartirResumen()">📤</button>
</div>

<!-- Metas -->
<div id="config" class="section">
    <div class="card">
        <h3>💰 Ingreso Mensual</h3>
        <input type="number" id="inputIngreso" placeholder="Ej: 10000" onchange="recalcularTodo()">
    </div>
    <div class="card">
        <h3>📊 Distribución de gastos (%)</h3>
        <div id="porcentajesContainer"></div>
        <button class="btn" onclick="guardarConfig()">💾 Guardar y Aplicar</button>
        <div class="btn-group" style="margin-top:12px;">
            <button class="btn btn-secondary" onclick="exportarDatos()">📤 Exportar</button>
            <button class="btn btn-secondary" onclick="importarDatos()">📥 Importar</button>
        </div>
        <p class="text-xs" style="margin-top:8px;">Los datos se guardan en tu navegador.</p>
    </div>
</div>

<!-- Historial -->
<div id="historial" class="section">
    <div class="card">
        <h3>➕ Nuevo Gasto</h3>
        <div class="input-group">
            <label>Categoría</label>
            <select id="selectCategoria">
                <option value="Comida">🍔 Comida</option>
                <option value="Medicamentos">💊 Medicamentos</option>
                <option value="Luz">💡 Luz</option>
                <option value="Gas">🔥 Gas</option>
                <option value="Petroleo">🛢️ Petróleo (generador)</option>
                <option value="Agua">💧 Agua</option>
                <option value="Internet">🌐 Internet</option>
                <option value="Aseo">🧹 Aseo</option>
            </select>
        </div>
        <div class="input-group">
            <label>Monto ($)</label>
            <input type="number" id="inputMonto" placeholder="0.00">
        </div>
        <div class="input-group">
            <label>Descripción</label>
            <input type="text" id="inputDescripcion" placeholder="Ej: Súper, receta...">
        </div>
        <button class="btn" onclick="agregarGasto()">✅ Agregar</button>
    </div>
    <div class="card">
        <h3>🕒 Últimos movimientos</h3>
        <div id="listaHistorial"></div>
    </div>
</div>

<div id="toast" class="toast" onclick="ocultarToast()"></div>
<div id="offlineBadge" class="offline-badge">📡 Sin conexión</div>

<script>
    const STORAGE_KEY = 'controlGastos_v11';
    const CACHE_NAME = 'gasto-pwa-v2';
    const categorias = [
        { key: 'Comida', letra: 'C', color: '#e74c3c', pctDefault: 47 },
        { key: 'Medicamentos', letra: 'M', color: '#8b5cf6', pctDefault: 10.4 },
        { key: 'Luz', letra: 'L', color: '#f39c12', pctDefault: 4 },
        { key: 'Gas', letra: 'G', color: '#e67e22', pctDefault: 2 },
        { key: 'Petroleo', letra: 'P', color: '#7f8c8d', pctDefault: 4.8 },
        { key: 'Agua', letra: 'A', color: '#3498db', pctDefault: 10 },
        { key: 'Internet', letra: 'I', color: '#0ea5e9', pctDefault: 9.6 },
        { key: 'Aseo', letra: 'S', color: '#2ecc71', pctDefault: 5 }
    ];

    let appData = {
        ingreso: 0,
        porcentajes: {},
        gastos: []
    };

    categorias.forEach(c => appData.porcentajes[c.key] = c.pctDefault);

    function cargar() {
        const s = localStorage.getItem(STORAGE_KEY);
        if (s) {
            try {
                const p = JSON.parse(s);
                appData.ingreso = p.ingreso || 0;
                if (p.porcentajes) {
                    categorias.forEach(c => {
                        if (p.porcentajes[c.key] !== undefined) appData.porcentajes[c.key] = p.porcentajes[c.key];
                    });
                }
                appData.gastos = p.gastos || [];
            } catch (e) {}
        }
    }
    function guardar() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }

    function presupuesto(cat) { return (appData.ingreso * (appData.porcentajes[cat] || 0)) / 100; }
    function gastado(cat) { return appData.gastos.filter(g => g.categoria === cat).reduce((a, g) => a + g.monto, 0); }
    function restante(cat) { return presupuesto(cat) - gastado(cat); }
    function totalPresupuesto() { return categorias.reduce((a, c) => a + presupuesto(c.key), 0); }
    function totalGastado() { return appData.gastos.reduce((a, g) => a + g.monto, 0); }
    function totalRestante() { return totalPresupuesto() - totalGastado(); }
    function ahorro() { return Math.max(0, appData.ingreso - totalPresupuesto()); }

    function fmt(num) { return num.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    function renderResumen() {
        document.getElementById('ingresoDisplay').textContent = fmt(appData.ingreso);
        document.getElementById('totalPresupuesto').textContent = fmt(totalPresupuesto());
        document.getElementById('totalGastado').textContent = fmt(totalGastado());
        document.getElementById('totalRestante').textContent = fmt(totalRestante());
        document.getElementById('ahorroRecomendado').textContent = fmt(ahorro());
        renderRing();
        renderCategorias();
    }

    function renderRing() {
        const total = totalPresupuesto();
        const gastado = totalGastado();
        const porcentaje = total > 0 ? (gastado / total) * 100 : 0;
        const container = document.getElementById('ringContainer');
        const radio = 72;
        const circ = 2 * Math.PI * radio;
        const offset = circ - (Math.min(porcentaje, 100) / 100) * circ;
        container.innerHTML = `
            <svg width="160" height="160" viewBox="0 0 160 160">
                <circle cx="80" cy="80" r="${radio}" fill="none" stroke="var(--border)" stroke-width="12"/>
                <circle cx="80" cy="80" r="${radio}" fill="none" stroke="var(--primary)" stroke-width="12" 
                    stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" 
                    transform="rotate(-90 80 80)" style="transition: stroke-dashoffset 0.6s ease;"/>
                <text x="80" y="80" text-anchor="middle" dy="0.35em" font-size="24" font-weight="700" fill="var(--text)">${Math.round(porcentaje)}%</text>
            </svg>`;
    }

    function renderCategorias() {
        const cont = document.getElementById('categoriasContainer');
        cont.innerHTML = categorias.map(cat => {
            const p = presupuesto(cat.key);
            const g = gastado(cat.key);
            const r = restante(cat.key);
            const pct = p > 0 ? (g / p) * 100 : 0;
            const fill = pct > 80 ? 'fill-danger' : pct > 60 ? 'fill-warn' : 'fill-safe';
            const icono = `<span class="icono-categoria" style="background:${cat.color};">${cat.letra}</span>`;
            return `<div class="card">
                <h3>${icono} ${cat.key}</h3>
                <div class="row"><span class="label">Presupuesto</span><span class="value">$${fmt(p)}</span></div>
                <div class="row"><span class="label">Gastado</span><span class="value" style="color:${cat.color}">$${fmt(g)}</span></div>
                <div class="row"><span class="label">Restante</span><span class="value" style="color:${r < 0 ? 'var(--danger)' : 'var(--success)'}">$${fmt(r)}</span></div>
                <div class="progress-bar"><div class="progress-fill ${fill}" style="width:${Math.min(pct,100)}%"></div></div>
                <div class="text-xs" style="text-align:right;">${pct.toFixed(1)}% usado</div>
            </div>`;
        }).join('');
    }

    function renderConfig() {
        document.getElementById('inputIngreso').value = appData.ingreso || '';
        const pctCont = document.getElementById('porcentajesContainer');
        if (!pctCont.hasChildNodes() || pctCont.children.length === 0) {
            pctCont.innerHTML = categorias.map(cat => {
                const icono = `<span class="icono-categoria" style="background:${cat.color};">${cat.letra}</span>`;
                return `<div class="input-group">
                    <label>${icono} ${cat.key} (%)</label>
                    <input type="number" id="pct_${cat.key}" value="${appData.porcentajes[cat.key]}" 
                        step="any" min="0" max="100" oninput="actualizarPct('${cat.key}', this.value)">
                </div>`;
            }).join('');
        } else {
            categorias.forEach(cat => {
                const inp = document.getElementById('pct_' + cat.key);
                if (inp && document.activeElement !== inp) inp.value = appData.porcentajes[cat.key];
            });
        }
    }

    function renderHistorial() {
        const lista = document.getElementById('listaHistorial');
        if (appData.gastos.length === 0) {
            lista.innerHTML = '<p style="text-align:center; color:var(--text-secondary); padding:20px;">Sin gastos aún</p>';
            return;
        }
        const ultimos = [...appData.gastos].reverse().slice(0, 50);
        lista.innerHTML = ultimos.map(g => {
            const cat = categorias.find(c => c.key === g.categoria);
            const icono = cat ? `<span class="icono-categoria" style="background:${cat.color}; font-size:0.7rem; width:26px; height:26px;">${cat.letra}</span>` : '?';
            return `<div class="gasto-item">
                <div class="detalle">
                    <div class="categoria-texto">${icono} ${g.categoria}</div>
                    <div class="fecha">${g.fecha} &middot; ${g.descripcion}</div>
                </div>
                <span class="monto">-$${fmt(g.monto)}</span>
                <button class="btn btn-danger btn-sm" onclick="eliminar('${g.id}')">✕</button>
            </div>`;
        }).join('');
    }

    function actualizarPct(cat, val) {
        const num = parseFloat(val);
        if (isNaN(num)) return;
        appData.porcentajes[cat] = Math.min(100, Math.max(0, num));
        guardar();
        recalcularTodo();
    }

    function recalcularTodo() {
        const ingInput = document.getElementById('inputIngreso');
        if (ingInput) appData.ingreso = parseFloat(ingInput.value) || 0;
        guardar();
        renderResumen();
        renderConfig();
    }

    function guardarConfig() {
        recalcularTodo();
        let mensaje = `✅ Configuración guardada\nIngreso: $${fmt(appData.ingreso)}\n`;
        categorias.forEach(c => { mensaje += `${c.key}: ${appData.porcentajes[c.key]}%\n`; });
        mensaje += `💰 Ahorro: ${((ahorro() / appData.ingreso)*100).toFixed(1)}% del ingreso`;
        toast(mensaje);
        switchTab('presupuesto');
    }

    function agregarGasto() {
        const categoria = document.getElementById('selectCategoria').value;
        const monto = parseFloat(document.getElementById('inputMonto').value);
        const descripcion = document.getElementById('inputDescripcion').value.trim() || 'Sin descripción';
        if (!monto || monto <= 0) { toast('⚠️ Ingresa un monto válido'); return; }
        appData.gastos.push({
            id: Date.now().toString(36) + Math.random().toString(36).substr(2,4),
            categoria, monto, descripcion,
            fecha: new Date().toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit', year:'numeric' })
        });
        guardar();
        document.getElementById('inputMonto').value = '';
        document.getElementById('inputDescripcion').value = '';
        renderHistorial();
        renderResumen();
        toast('Gasto agregado exitosamente');
        switchTab('presupuesto');
    }

    function eliminar(id) {
        if (!confirm('¿Eliminar este gasto?')) return;
        appData.gastos = appData.gastos.filter(g => g.id !== id);
        guardar();
        renderHistorial();
        renderResumen();
        toast('Gasto eliminado');
    }

    function switchTab(tab) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tab).classList.add('active');
        document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
        if (tab === 'presupuesto') renderResumen();
        else if (tab === 'config') renderConfig();
        else if (tab === 'historial') renderHistorial();
    }

    // Compartir resumen
    async function compartirResumen() {
        const texto = `💰 Mis gastos este mes:
📊 Presupuesto total: $${fmt(totalPresupuesto())}
💸 Gastado: $${fmt(totalGastado())}
✅ Restante: $${fmt(totalRestante())}
🏦 Ahorro: $${fmt(ahorro())}

${categorias.map(c => `${c.key}: $${fmt(gastado(c.key))} / $${fmt(presupuesto(c.key))}`).join('\n')}`;
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Mi Control de Gastos',
                    text: texto,
                    url: window.location.href
                });
                toast('¡Compartido!');
            } catch (e) { toast('Compartir cancelado'); }
        } else {
            toast('Tu navegador no soporta compartir. Copia el texto manualmente.');
            console.log(texto);
        }
    }

    // Exportar datos
    function exportarDatos() {
        const dataStr = JSON.stringify(appData, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gastos_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        toast('Datos exportados');
    }

    // Importar datos
    function importarDatos() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (imported.ingreso !== undefined && imported.porcentajes && imported.gastos !== undefined) {
                        appData = imported;
                        guardar();
                        recalcularTodo();
                        renderHistorial();
                        toast('Datos importados correctamente');
                        switchTab('presupuesto');
                    } else throw new Error();
                } catch (err) { toast('Archivo inválido'); }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    // Toast con desaparición automática a los 3 segundos
    let toastTimeout = null;
    function toast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        if (toastTimeout) clearTimeout(toastTimeout);
        t.textContent = msg;
        t.classList.remove('show');
        setTimeout(() => t.classList.add('show'), 10);
        toastTimeout = setTimeout(() => { t.classList.remove('show'); toastTimeout = null; }, 3000);
    }
    function ocultarToast() {
        const t = document.getElementById('toast');
        if (t && toastTimeout) { clearTimeout(toastTimeout); toastTimeout = null; t.classList.remove('show'); }
    }

    // Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js').then(reg => {
                console.log('SW registrado:', reg.scope);
            }).catch(err => console.error('Error SW:', err));
        });
    }

    // Online/offline
    function updateOnlineStatus() {
        const badge = document.getElementById('offlineBadge');
        if (!navigator.onLine) { badge.classList.add('show'); toast('⚠️ Sin conexión. Los datos se guardan localmente.'); }
        else badge.classList.remove('show');
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    cargar();
    renderResumen();
    if (!appData.ingreso && appData.gastos.length === 0) switchTab('config');
</script>
</body>
</html>
